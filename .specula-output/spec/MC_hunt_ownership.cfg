\* Scenario 3 (MC-5): partition ownership with duplicated / reordered client
\* requests (request timeout -> late delivery), epoch-0 rejoin with the same
\* member id, unchecked -1 leave, and lost responses. One broker.
SPECIFICATION MCSpec

CONSTANTS
    Brokers = {b1}
    InitLeader = b1
    Members = {m1, m2}
    Partitions = {"p1", "p2"}
    Topics = {"t1"}
    TopicOf <- MCTopicOf1
    Regexes = {}
    RegexMatch <- MCRegexMatchNone
    Subscriptions <- MCSubsT1
    InitialSub <- MCInitialSubT1
    NoRegex = NoRegex
    Null = Null
    AssignInterval = 0

    MaxLeaderChange = 0
    MaxFlushFail = 0
    MaxOpTimeout = 0
    MaxTimerFire = 1
    MaxRefresh = 0
    MaxTick = 0
    MaxJoin = 3
    MaxHeartbeat = 4
    MaxSubChange = 0
    MaxLeave = 1
    MaxReqTimeout = 2
    MaxLose = 1
    MaxLog = 7

SYMMETRY MemberSymmetry
CONSTRAINT MCConstraint

INVARIANTS
    \* Scenario 3 targets
    PartitionOwnershipExclusive
    ClientOwnershipExclusive
    OwnedImpliesAssigned
    PartitionEpochMapConsistent
    MemberEpochBounds
    NoSpuriousFence
