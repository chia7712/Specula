\* Scenario 4 (MC-6): regex subscription changes that never trigger a target
\* recompute. Both members subscribe to regex A (matches t1); one switches to
\* regex B, which matches no topic. One broker.
SPECIFICATION MCSpec

CONSTANTS
    Brokers = {b1}
    InitLeader = b1
    Members = {m1, m2}
    Partitions = {"p1", "p2"}
    Topics = {"t1"}
    TopicOf <- MCTopicOf1
    Regexes = {"A", "B"}
    RegexMatch <- MCRegexMatchAB
    Subscriptions <- MCSubsRegex
    InitialSub <- MCInitialSubA
    NoRegex = NoRegex
    Null = Null
    AssignInterval = 0

    MaxLeaderChange = 0
    MaxFlushFail = 0
    MaxOpTimeout = 0
    MaxTimerFire = 0
    MaxRefresh = 1
    MaxTick = 0
    MaxJoin = 2
    MaxHeartbeat = 6
    MaxSubChange = 1
    MaxLeave = 0
    MaxReqTimeout = 0
    MaxLose = 0
    MaxLog = 8

CONSTRAINT MCConstraint

INVARIANTS
    \* Scenario 4 target
    StableImpliesFullyAssigned
    \* Core safety
    PartitionOwnershipExclusive
    MemberEpochBounds
