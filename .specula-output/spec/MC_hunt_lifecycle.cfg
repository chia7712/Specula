\* Scenario 1 (MC-1, MC-2): coordinator load/unload lifecycle vs leader epochs.
\* Two brokers, three leadership changes (e1 -> e2 -> e3 -> e4) so that one
\* broker can unload and reload while an earlier load is still in flight, and
\* a stale ACTIVE context can run after re-election. Client activity is kept
\* small; non-lifecycle faults are off.
SPECIFICATION MCSpec

CONSTANTS
    Brokers = {b1, b2}
    InitLeader = b1
    Members = {m1}
    Partitions = {"p1"}
    Topics = {"t1"}
    TopicOf <- MCTopicOfP1
    Regexes = {}
    RegexMatch <- MCRegexMatchNone
    Subscriptions <- MCSubsT1
    InitialSub <- MCInitialSubT1
    NoRegex = NoRegex
    Null = Null
    AssignInterval = 0

    MaxLeaderChange = 3
    MaxFlushFail = 0
    MaxOpTimeout = 0
    MaxTimerFire = 0
    MaxRefresh = 0
    MaxTick = 0
    MaxJoin = 2
    MaxHeartbeat = 2
    MaxSubChange = 0
    MaxLeave = 0
    MaxReqTimeout = 1
    MaxLose = 0
    MaxLog = 4

CONSTRAINT MCConstraint

INVARIANTS
    \* Scenario 1 targets
    NoStaleLoadCompletion
    NoActiveWhileLoading
    AppendFromLogState
    NoReplayErrorOnLoad
    CommittedReplayOk
    AckedImpliesCommitted
    \* Core safety
    PartitionOwnershipExclusive
    MemberEpochBounds
