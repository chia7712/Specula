\* Scenario 2 (MC-3, MC-4): timers are not reverted with a failed batch and a
\* failed timer write is retried by key. One broker (no failover), two members
\* so that revocation (UNREVOKED_PARTITIONS + rebalance timer) happens.
SPECIFICATION MCSpec

CONSTANTS
    Brokers = {b1}
    InitLeader = b1
    Members = {m1, m2}
    Partitions = {"p1", "p2"}
    Topics = {"t1"}
    TopicOf <- MCTopicOf1
    Regexes = {}
    RegexMatch <- MCRegexMatchNone
    Subscriptions <- MCSubsT1
    InitialSub <- MCInitialSubT1
    NoRegex = NoRegex
    Null = Null
    AssignInterval = 0

    MaxLeaderChange = 0
    MaxFlushFail = 1
    MaxOpTimeout = 1
    MaxTimerFire = 2
    MaxRefresh = 0
    MaxTick = 0
    MaxJoin = 3
    MaxHeartbeat = 3
    MaxSubChange = 0
    MaxLeave = 1
    MaxReqTimeout = 0
    MaxLose = 0
    MaxLog = 6

SYMMETRY MemberSymmetry
CONSTRAINT MCConstraint

INVARIANTS
    \* Scenario 2 targets
    NoSpuriousFence
    TimersCoverMembers
    \* Core safety
    PartitionOwnershipExclusive
    MemberEpochBounds
    AckedImpliesCommitted
