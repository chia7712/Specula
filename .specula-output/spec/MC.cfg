\* Standard model-checking config: core safety + structural invariants.
\* Scenario (extension) invariants are listed but commented out; they are
\* enabled in the MC_hunt_*.cfg files.
SPECIFICATION MCSpec

CONSTANTS
    Brokers = {b1, b2}
    InitLeader = b1
    Members = {m1, m2}
    Partitions = {"p1", "p2"}
    Topics = {"t1", "t2"}
    TopicOf <- MCTopicOf2
    Regexes = {}
    RegexMatch <- MCRegexMatchNone
    Subscriptions <- MCSubsSplit
    InitialSub <- MCInitialSubAll
    NoRegex = NoRegex
    Null = Null
    AssignInterval = 0

    MaxLeaderChange = 1
    MaxFlushFail = 1
    MaxOpTimeout = 1
    MaxTimerFire = 1
    MaxRefresh = 0
    MaxTick = 0
    MaxJoin = 2
    MaxHeartbeat = 3
    MaxSubChange = 1
    MaxLeave = 1
    MaxReqTimeout = 1
    MaxLose = 1
    MaxLog = 5

CONSTRAINT MCConstraint

INVARIANTS
    \* Structural
    TypeOK
    \* Core safety (brief section 5)
    PartitionOwnershipExclusive
    MemberEpochBounds
    PartitionEpochMapConsistent
    CommittedReplayOk
    AckedImpliesCommitted
    \* Scenario invariants (enabled in hunt cfgs)
    \* NoStaleLoadCompletion
    \* NoActiveWhileLoading
    \* AppendFromLogState
    \* NoReplayErrorOnLoad
    \* NoSpuriousFence
    \* TimersCoverMembers
    \* ClientOwnershipExclusive
    \* OwnedImpliesAssigned
    \* StableImpliesFullyAssigned
