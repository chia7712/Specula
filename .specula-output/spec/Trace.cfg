\* Trace validation config. Constants must match the names the harness emits
\* (instrumentation-spec.md S3). Default trace: ../traces/trace.ndjson,
\* override with the JSON environment variable.
SPECIFICATION TraceSpec
VIEW TraceView
CHECK_DEADLOCK FALSE

CONSTANTS
    Brokers = {"b1", "b2"}
    InitLeader = "b1"
    Members = {"m1", "m2"}
    Partitions = {"p1", "p2"}
    Topics = {"t1"}
    TopicOf <- TraceTopicOf
    Regexes = {"A", "B"}
    RegexMatch <- TraceRegexMatch
    Subscriptions <- TraceSubscriptions
    InitialSub <- TraceInitialSub
    NoRegex = NoRegex
    Null = Null
    AssignInterval = 0

INVARIANTS
    TypeOK
    PartitionOwnershipExclusive
    MemberEpochBounds
    PartitionEpochMapConsistent
    CommittedReplayOk
    AckedImpliesCommitted
    AppendFromLogState
    NoActiveWhileLoading

PROPERTIES
    TraceMatched

ALIAS TraceAlias
